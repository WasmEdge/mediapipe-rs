[package]
name = "mediapipe-rs"
version = "0.1.0-dev"
edition = "2021"
authors = ["bo.yang@smail.nju.edu.cn"]
categories = ["Webassembly"]
keywords = ["Webassembly", "wasm", "neural-network", "inference"]
license-file = "LICENSE"
readme = "README.md"
build = "src/build.rs"
documentation = "https://docs.rs/mediapipe-rs"
repository = "https://github.com/WasmEdge/mediapipe-rs"
description = "A Rust library for mediapipe tasks"
publish = true

[package.metadata.docs.rs]
all-features = true
# only build for wasm32-wasip1 now
default-target = "wasm32-wasip1"
targets = ["wasm32-wasip1"]

include = [
    "LICENSE",
    "README.md",
    "Cargo.toml",
    "/src",
]

[lib]
doctest = false

[dependencies]
wasi-nn = "0.4.0"
thiserror = "1"
flatbuffers = "^23"
image = { version = "0.25", default-features = false, optional = true }
imageproc = { version = "0.27", default-features = false, optional = true }
ab_glyph = { version = "0.2", optional = true }
regex = { version = "1", optional = true }
lazy_static = { version = "1", optional = true }
symphonia-core = { version = "0.5", optional = true }

[dependencies.ffmpeg-next]
features = ["static"]
optional = true
git = "https://github.com/yanghaku/rust-ffmpeg.git"
branch = "wasm32-wasi"


[features]
# default is all task types
default = ["audio", "vision", "text"]

audio = ["symphonia-core"]
vision = ["image", "imageproc", "imageproc/text", "lazy_static", "ab_glyph"]
text = ["regex", "lazy_static"]

ffmpeg = ["ffmpeg-next"]


[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }

[[example]]
name = "audio_classification"
required-features = ["audio"]

[[example]]
name = "face_landmark"
required-features = ["vision"]

[[example]]
name = "gesture_recognition"
required-features = ["vision"]

[[example]]
name = "image_classification"
required-features = ["vision"]

[[example]]
name = "image_embedding"
required-features = ["vision"]

[[example]]
name = "object_detection"
required-features = ["vision"]

[[example]]
name = "text_classification"
required-features = ["text"]

[[test]]
name = "audio_classification"
required-features = ["audio"]

[[test]]
name = "face_detection"
required-features = ["vision"]

[[test]]
name = "face_landmark"
required-features = ["vision"]

[[test]]
name = "ffmpeg_video_input"
required-features = ["vision", "ffmpeg"]

[[test]]
name = "gesture_recognition"
required-features = ["vision"]

[[test]]
name = "hand_landmark"
required-features = ["vision"]

[[test]]
name = "image_classification"
required-features = ["vision"]

[[test]]
name = "image_embedding"
required-features = ["vision"]

[[test]]
name = "image_segmentation"
required-features = ["vision"]

[[test]]
name = "object_detection"
required-features = ["vision"]

[[test]]
name = "text_classification"
required-features = ["text"]

[[test]]
name = "text_embedding"
required-features = ["text"]
